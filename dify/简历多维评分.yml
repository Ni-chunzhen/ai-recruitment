app:
  description: 阶段5·简历多维评分。输入岗位JD、能力维度(name/description/weight)、已确认简历文本，输出各维度0~100分与辅助建议。不使用面试评分锚点；加权总分由后端按岗位权重复算。
  icon: 📊
  icon_background: '#FFF4E8'
  icon_type: emoji
  mode: workflow
  name: 简历多维评分
  use_icon_as_answer_icon: false
