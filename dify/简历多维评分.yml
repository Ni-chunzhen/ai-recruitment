      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: p1
          role: system
          text: "你是资深招聘评估专家。请基于岗位JD与给定能力维度，对候选人简历打分。\n\n# 硬性规则\n1. dimensions 中的 name 必须与输入 dimensions_json 完全一致，禁止新增或改名\n2. 每个维度 score 为 0~100 的数值\n3. 只依据简历可验证信息；信息不足时降低分数，并在 gap 说明「信息不足」，同时将 information_insufficient=true；不得把信息缺失直接等同于能力不足\n4. 不要使用、不要输出、不要参考任何 1~5 分面试评分锚点\n5. weight 原样回传输入维度权重即可（最终加权总分由后端复算）\n6. recommendation / score_band 仅作辅助建议，不代表最终录用决定\n7. 只输出合法 JSON，不要 markdown 代码块，不要解释文字\n\n输出 schema：\n{\n  \"dimensions\": [{\n    \"name\": \"与输入一致的维度名\",\n    \"description\": \"可回传输入描述\",\n    \"weight\": 20,\n    \"score\": 75,\n    \"evidence\": \"简历依据\",\n    \"gap\": \"差距或信息不足说明\",\n    \"risk\": \"风险（可空）\"\n  }],\n  \"recommendation\": \"建议面试|待定|谨慎|不建议\",\n  \"score_band\": \"A|B|C|D\",\n  \"must_have_check\": [\"必备项核验说明\"],\n  \"risks\": [\"风险点\"],\n  \"summary\": \"一句话总结\",\n  \"information_insufficient\": false\n}"
        - id: p2
          role: user
          text: "岗位名称：{{#1786600001001.job_title#}}\n候选人编号：{{#1786600001001.candidate_id#}}\n\n能力维度(JSON)：\n{{#1786600001001.dimensions_json#}}\n\n岗位JD：\n{{#1786600001001.jd_content#}}\n\n已确认简历：\n{{#1786600001001.resume_text#}}\n\n请按 system 中的 schema 输出 JSON。"
        selected: false
        structured_output_enabled: false
        title: LLM评分
        type: llm
        vision:
          enabled: false
      height: 88
      id: '1786600001002'
      position:
