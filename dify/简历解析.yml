          - resume_text
          value_type: string
          variable: resume_text
        - value_selector:
          - '1786500001001'
          - candidate_id
          value_type: string
          variable: candidate_id
      height: 52
      id: '1786500001003'
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      type: custom
      width: 242
      zIndex: 0
    - data:
        outputs:
        - value_selector:
          - '1786500001003'
          - result
